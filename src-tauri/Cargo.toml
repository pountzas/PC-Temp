[package]
name = "pc-temp"
version = "0.1.0"
description = "PC-Temp hardware monitor widget"
authors = ["pountzas"]
edition = "2021"
default-run = "pc-temp"
autobins = false

[[bin]]
name = "pc-temp"
path = "src/main.rs"
test = false

[lib]
name = "pc_temp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
mcp-bridge = ["dep:tauri-plugin-mcp-bridge"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
nvml-wrapper = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.40"
tauri = { version = "2", default-features = false, features = [
    "tray-icon",
    "wry",
    "compression",
    "dynamic-acl",
] }
tauri-plugin-mcp-bridge = { version = "0.13", optional = true }
tauri-plugin-store = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

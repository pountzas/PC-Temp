# Security baseline: secret scan + dependency audit.
# PR scans: dev → main only; dev-target PRs skip jobs (OQ-26 / #63 gate).
name: security

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    branches:
      - dev
      - main
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  secrets:
    name: gitleaks
    if: (github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'dev') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: dependency-audit
    if: (github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'dev') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@e69cc6c86b31f1e7e23935bbe7031b50e51082de # v2.0.2
        with:
          scan-args: |-
            --recursive
            ./

      - name: Install cargo-audit
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit

      - name: Cargo audit
        if: ${{ !cancelled() }}
        run: cargo audit --file src-tauri/Cargo.lock
# Security baseline: secret scan + dependency audit.
# Private repo: no PR trigger (OQ-26 / spending limits); weekly + manual only.
name: security

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9

  dependencies:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@312c2574dcbddbfaa3f0d5739046dc612e087baa
        with:
          scan-args: |-
            --recursive
            ./

      - name: Install cargo-audit
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.59.3
        with:
          tool: cargo-audit

      - name: Cargo audit
        run: cargo audit --manifest-path src-tauri/Cargo.toml
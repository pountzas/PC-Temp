# Manual Windows installer build (#21) — NSIS bundle with sidecar; PawnIO is not included.
name: release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    name: windows-nsis-installer
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup .NET (sidecar)
        uses: actions/setup-dotnet@87b7050bc53ea08284295505d98d2aa94301e852 # v4.2.0
        with:
          dotnet-version: 8.0.x

      - name: Build NSIS installer
        run: pnpm tauri build

      - name: Assert sidecar and fonts are built
        shell: pwsh
        run: |
          if (-not (Test-Path src-tauri/target/release/lhm-reader.exe)) { throw 'lhm-reader.exe missing next to pc-temp.exe' }
          if (-not (Test-Path src-tauri/target/release/pc-temp.exe)) { throw 'pc-temp.exe missing' }
          $fonts = Get-ChildItem -Path dist/assets -Filter '*.woff2' -ErrorAction Stop
          if ($fonts.Count -lt 1) { throw 'no woff2 fonts in dist/assets' }

      - name: Assert bundle excludes WinRing0 and bundled PawnIO
        shell: pwsh
        run: |
          $bundleRoot = Get-ChildItem -Path src-tauri/target/release/bundle -ErrorAction Stop
          $winRing = Get-ChildItem -Recurse -Path $bundleRoot.FullName -Filter '*WinRing0*' -ErrorAction SilentlyContinue
          if ($winRing) { throw "WinRing0 artifacts in bundle: $($winRing.FullName -join ', ')" }
          $pawnBundled = Get-ChildItem -Recurse -Path $bundleRoot.FullName -Filter 'PawnIO_setup*.exe' -ErrorAction SilentlyContinue
          if ($pawnBundled) { throw "PawnIO setup must not be bundled: $($pawnBundled.FullName -join ', ')" }

      - name: Publish installer SHA-256
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path src-tauri/target/release/bundle/nsis/*.exe -ErrorAction Stop)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installers.Count): $($installers.Name -join ', ')" }
          $installer = $installers[0]
          $hash = (Get-FileHash -Algorithm SHA256 -Path $installer.FullName).Hash.ToLower()
          $checksumPath = "$($installer.FullName).sha256"
          Set-Content -Path $checksumPath -Value $hash -NoNewline
          Write-Host "SHA-256 for $($installer.Name): $hash"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload installer
        uses: actions/upload-artifact@b689b11cbb06db086888dfd9eb88e639e5943e0f # v4.6.0
        with:
          name: pc-temp-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
          if-no-files-found: error